name: CI

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov import-linter pydantic
        
    - name: Check Layering (Import Linter)
      run: lint-imports
        
    - name: Testing Pyramid (Coverage Gate)
      run: pytest --cov=services/ --cov-fail-under=75
